<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Official Banner — test</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
      body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <div style="--container-padding: 1rem">
      <div class="govbb-official-banner">
        <div class="govbb-official-banner__inner">
          <div class="govbb-official-banner__crest">
            <img class="govbb-official-banner__icon" src="../../assets/images/govbb-creast.svg" alt="Government of Barbados coat of arms" />
          </div>
          <div class="govbb-official-banner__text">
            <span>Official government website</span>
            <span class="govbb-official-banner__link" role="link" tabindex="0">Learn more</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
