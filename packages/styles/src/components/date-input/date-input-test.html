<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Input — test</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
      body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      section { margin-bottom: 2.5rem; }
    </style>
  </head>
  <body>
    <section>
      <h2>Default</h2>
      <div class="govbb-form-group">
        <fieldset class="govbb-fieldset" aria-describedby="dob-hint">
          <legend class="govbb-fieldset__legend">Date of birth</legend>
          <p class="govbb-hint" id="dob-hint">For example, 27 3 1990</p>
          <div class="govbb-date-input">
            <div class="govbb-date-input__part">
              <label class="govbb-date-input__label" for="dob-day">Day</label>
              <div class="govbb-date-input-wrapper">
                <input class="govbb-date-input__field" id="dob-day" name="dob[day]" type="text" inputmode="numeric" />
              </div>
            </div>
            <div class="govbb-date-input__part">
              <label class="govbb-date-input__label" for="dob-month">Month</label>
              <div class="govbb-date-input-wrapper">
                <input class="govbb-date-input__field" id="dob-month" name="dob[month]" type="text" inputmode="numeric" />
              </div>
            </div>
            <div class="govbb-date-input__part">
              <label class="govbb-date-input__label" for="dob-year">Year</label>
              <div class="govbb-date-input-wrapper govbb-date-input-wrapper--year">
                <input class="govbb-date-input__field" id="dob-year" name="dob[year]" type="text" inputmode="numeric" />
              </div>
            </div>
          </div>
        </fieldset>
      </div>
    </section>

    <section>
      <h2>Error</h2>
      <div class="govbb-form-group">
        <fieldset class="govbb-fieldset" aria-describedby="dob2-error">
          <legend class="govbb-fieldset__legend">Date of birth (error)</legend>
          <p class="govbb-error-message" id="dob2-error" role="alert">Enter a valid date</p>
          <div class="govbb-date-input">
            <div class="govbb-date-input__part">
              <label class="govbb-date-input__label" for="dob2-day">Day</label>
              <div class="govbb-date-input-wrapper">
                <input class="govbb-date-input__field" id="dob2-day" type="text" inputmode="numeric" aria-invalid="true" />
              </div>
            </div>
            <div class="govbb-date-input__part">
              <label class="govbb-date-input__label" for="dob2-month">Month</label>
              <div class="govbb-date-input-wrapper">
                <input class="govbb-date-input__field" id="dob2-month" type="text" inputmode="numeric" aria-invalid="true" />
              </div>
            </div>
            <div class="govbb-date-input__part">
              <label class="govbb-date-input__label" for="dob2-year">Year</label>
              <div class="govbb-date-input-wrapper govbb-date-input-wrapper--year">
                <input class="govbb-date-input__field" id="dob2-year" type="text" inputmode="numeric" aria-invalid="true" />
              </div>
            </div>
          </div>
        </fieldset>
      </div>
    </section>
  </body>
</html>
