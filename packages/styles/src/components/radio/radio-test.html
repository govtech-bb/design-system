<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio — test</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
      body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      section { margin-bottom: 2.5rem; }
    </style>
  </head>
  <body>
    <section>
      <h2>Default</h2>
      <fieldset class="govbb-fieldset">
        <legend class="govbb-fieldset__legend">Where do you live?</legend>
        <div class="govbb-radio-item">
          <input class="govbb-radio" id="parish-st-michael" type="radio" name="parish" value="st-michael" />
          <label class="govbb-radio-item__label" for="parish-st-michael">Saint Michael</label>
        </div>
        <div class="govbb-radio-item">
          <input class="govbb-radio" id="parish-christ-church" type="radio" name="parish" value="christ-church" />
          <label class="govbb-radio-item__label" for="parish-christ-church">Christ Church</label>
        </div>
      </fieldset>
    </section>

    <section>
      <h2>Per-option hints</h2>
      <fieldset class="govbb-fieldset">
        <legend class="govbb-fieldset__legend">How would you like to be contacted?</legend>
        <div class="govbb-radio-item">
          <input class="govbb-radio" id="contact-email" type="radio" name="contact" value="email" aria-describedby="contact-email-hint" />
          <label class="govbb-radio-item__label" for="contact-email">Email</label>
          <div class="govbb-radio-item__hint" id="contact-email-hint">We'll only use this to send updates about your application.</div>
        </div>
        <div class="govbb-radio-item">
          <input class="govbb-radio" id="contact-phone" type="radio" name="contact" value="phone" aria-describedby="contact-phone-hint" />
          <label class="govbb-radio-item__label" for="contact-phone">Phone</label>
          <div class="govbb-radio-item__hint" id="contact-phone-hint">A government officer may call between 9am and 5pm.</div>
        </div>
        <div class="govbb-radio-item">
          <input class="govbb-radio" id="contact-post" type="radio" name="contact" value="post" />
          <label class="govbb-radio-item__label" for="contact-post">Post</label>
        </div>
      </fieldset>
    </section>

    <section>
      <h2>Conditional reveal</h2>
      <fieldset class="govbb-fieldset">
        <legend class="govbb-fieldset__legend">Preferred contact method</legend>
        <div class="govbb-radio-item">
          <input class="govbb-radio" id="r-email" type="radio" name="contact2" value="email" />
          <label class="govbb-radio-item__label" for="r-email">Email</label>
        </div>
        <div class="govbb-radio-item__conditional">
          <div class="govbb-form-group">
            <label class="govbb-label" for="r-email-addr">Email address</label>
            <div class="govbb-input-wrapper">
              <input class="govbb-input" id="r-email-addr" type="email" />
            </div>
          </div>
        </div>
        <div class="govbb-radio-item">
          <input class="govbb-radio" id="r-phone" type="radio" name="contact2" value="phone" checked />
          <label class="govbb-radio-item__label" for="r-phone">Phone</label>
        </div>
        <div class="govbb-radio-item__conditional">
          <div class="govbb-form-group">
            <label class="govbb-label" for="r-phone-num">Phone number</label>
            <div class="govbb-input-wrapper">
              <input class="govbb-input" id="r-phone-num" type="tel" />
            </div>
          </div>
        </div>
        <div class="govbb-radio-item">
          <input class="govbb-radio" id="r-post" type="radio" name="contact2" value="post" disabled />
          <label class="govbb-radio-item__label" for="r-post">Post (disabled)</label>
        </div>
      </fieldset>
    </section>
  </body>
</html>
