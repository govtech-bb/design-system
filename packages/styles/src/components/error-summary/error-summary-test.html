<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Summary — test</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
      body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      section { margin-bottom: 2.5rem; }
    </style>
  </head>
  <body>
    <section>
      <h2>Multiple errors</h2>
      <div class="govbb-error-summary" role="alert" aria-labelledby="err-1-title">
        <h2 id="err-1-title" class="govbb-error-summary__title">There is a problem</h2>
        <ul class="govbb-error-summary__list">
          <li><a class="govbb-error-summary__link" href="#field-email">Enter a valid email address</a></li>
          <li><a class="govbb-error-summary__link" href="#field-parish">Select a parish</a></li>
          <li><a class="govbb-error-summary__link" href="#field-terms">Accept the terms and conditions</a></li>
        </ul>
      </div>
    </section>

    <section>
      <h2>Single error</h2>
      <div class="govbb-error-summary" role="alert" aria-labelledby="err-2-title">
        <h2 id="err-2-title" class="govbb-error-summary__title">There is a problem</h2>
        <ul class="govbb-error-summary__list">
          <li><a class="govbb-error-summary__link" href="#f">Enter your full name</a></li>
        </ul>
      </div>
    </section>
  </body>
</html>
