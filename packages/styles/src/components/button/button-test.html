<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button — test</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
      body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      section { margin-bottom: 2.5rem; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    </style>
  </head>
  <body>
    <section>
      <h2>Variants</h2>
      <div class="row">
        <button class="govbb-btn">Primary</button>
        <button class="govbb-btn--secondary">Secondary</button>
        <button class="govbb-btn--destructive">Destructive</button>
        <button class="govbb-btn--tertiary">Tertiary</button>
      </div>
      <div class="row">
        <button class="govbb-btn--link">Link</button>
        <button class="govbb-btn--destructive-link">Destructive Link</button>
      </div>
    </section>

    <section>
      <h2>Disabled</h2>
      <div class="row">
        <button class="govbb-btn" disabled>Disabled Primary</button>
        <button class="govbb-btn--secondary" disabled>Disabled Secondary</button>
        <button class="govbb-btn--destructive" disabled>Disabled Destructive</button>
        <button class="govbb-btn--tertiary" disabled>Disabled Tertiary</button>
      </div>
      <div class="row">
        <button class="govbb-btn--link" disabled>Disabled Link</button>
        <button class="govbb-btn--destructive-link" disabled>Disabled Destructive Link</button>
      </div>
    </section>
  </body>
</html>
