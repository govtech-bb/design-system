<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Input — test</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
      body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
      section { margin-bottom: 2.5rem; }
    </style>
  </head>
  <body>
    <section>
      <h2>Default</h2>
      <div class="govbb-form-group">
        <label class="govbb-label" for="f-qty">Quantity</label>
        <p class="govbb-hint" id="f-qty-hint">Between 1 and 10</p>
        <div class="govbb-number-input-wrapper" role="group">
          <input class="govbb-number-input" id="f-qty" type="number" inputmode="numeric" min="1" max="10" step="1" value="1" aria-describedby="f-qty-hint" />
          <div class="govbb-number-input__steppers">
            <button type="button" class="govbb-number-input__step govbb-number-input__step--up" tabindex="-1" aria-label="Increment" aria-controls="f-qty"></button>
            <span class="govbb-number-input__divider" aria-hidden="true"></span>
            <button type="button" class="govbb-number-input__step govbb-number-input__step--down" tabindex="-1" aria-label="Decrement" aria-controls="f-qty"></button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>Error</h2>
      <div class="govbb-form-group">
        <label class="govbb-label" for="f-qty-err">Quantity (error)</label>
        <p class="govbb-error-message" id="f-qty-err-error" role="alert">Enter a valid quantity</p>
        <div class="govbb-number-input-wrapper" role="group">
          <input class="govbb-number-input" id="f-qty-err" type="number" inputmode="numeric" aria-invalid="true" aria-describedby="f-qty-err-error" />
          <div class="govbb-number-input__steppers">
            <button type="button" class="govbb-number-input__step govbb-number-input__step--up" tabindex="-1" aria-label="Increment" aria-controls="f-qty-err"></button>
            <span class="govbb-number-input__divider" aria-hidden="true"></span>
            <button type="button" class="govbb-number-input__step govbb-number-input__step--down" tabindex="-1" aria-label="Decrement" aria-controls="f-qty-err"></button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
