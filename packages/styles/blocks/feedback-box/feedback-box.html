<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback box block — GOVBB</title>
    <link rel="stylesheet" href="../../src/dist.css" />
    <link rel="stylesheet" href="./feedback-box.css" />
    <style>
      body {
        padding: var(--spacing-m);
        max-width: 652px;
        margin-inline: auto;
      }
    </style>
  </head>
  <body>
    <div class="govbb-feedback-box">
      <h3 class="govbb-feedback-box__title govbb-text-h3">Was this helpful?</h3>
      <p class="govbb-feedback-box__description govbb-text-body">
        Give us your feedback about this page.
      </p>
      <a class="govbb-link govbb-link--secondary govbb-text-body" href="/feedback"
        >Help us improve alpha.gov.bb</a
      >
    </div>
  </body>
</html>
