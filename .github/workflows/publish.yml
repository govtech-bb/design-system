name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish'
        required: true
        default: 'styles'
        type: choice
        options:
          - styles
          - react
          - design
          - all
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter=@govtech-bb/react --filter=@govtech-bb/styles

      - name: Publish design package
        if: ${{ inputs.package == 'design' || inputs.package == 'all' || github.event_name == 'push' }}
        run: pnpm publish --filter=@govtech-bb/design --provenance --access public --no-git-checks --tag ${{ inputs.tag || 'latest' }}
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish react package
        if: ${{ inputs.package == 'react' || inputs.package == 'all' || github.event_name == 'push' }}
        run: pnpm publish --filter=@govtech-bb/react --provenance --access public --no-git-checks --tag ${{ inputs.tag || 'latest' }}
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish styles package
        if: ${{ inputs.package == 'styles' || inputs.package == 'all' || github.event_name == 'push' }}
        run: pnpm publish --filter=@govtech-bb/styles --provenance --access public --no-git-checks --tag ${{ inputs.tag || 'alpha' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
