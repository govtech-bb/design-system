name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter=@govtech-bb/react --filter=@govtech-bb/styles

      # Each step skips a version that's already on npm (so unchanged packages
      # don't fail the run) but fails loudly on a real publish error — no
      # continue-on-error masking auth/build failures as green.
      - name: Publish design package
        run: |
          VERSION=$(node -p "require('./packages/design/package.json').version")
          if npm view "@govtech-bb/design@$VERSION" version > /dev/null 2>&1; then
            echo "@govtech-bb/design@$VERSION already published — skipping"
          else
            pnpm publish --filter=@govtech-bb/design --provenance --access public --no-git-checks --tag alpha
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish react package
        run: |
          VERSION=$(node -p "require('./packages/react/package.json').version")
          if npm view "@govtech-bb/react@$VERSION" version > /dev/null 2>&1; then
            echo "@govtech-bb/react@$VERSION already published — skipping"
          else
            pnpm publish --filter=@govtech-bb/react --provenance --access public --no-git-checks --tag alpha
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish styles package
        run: |
          VERSION=$(node -p "require('./packages/styles/package.json').version")
          if npm view "@govtech-bb/styles@$VERSION" version > /dev/null 2>&1; then
            echo "@govtech-bb/styles@$VERSION already published — skipping"
          else
            pnpm publish --filter=@govtech-bb/styles --provenance --access public --no-git-checks --tag alpha
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
