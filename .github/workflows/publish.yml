name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter=@govtech-bb/react --filter=@govtech-bb/styles

      # OIDC trusted publishing — no NPM_TOKEN; auth + provenance both come from the
      # id-token: write permission above. OIDC works only through the npm CLI, and
      # npm publish doesn't understand workspace:*, so we pnpm-pack each package
      # first (pnpm rewrites workspace:* -> the real version in the tarball) and then
      # npm-publish the tarball. Already-published versions are skipped; real errors
      # fail the run. Explicit package list so a future package can't auto-publish.
      - name: Publish packages (OIDC)
        run: |
          set -euo pipefail
          npm install -g npm@latest
          mkdir -p /tmp/pkgs
          for pkg in design react styles; do
            name="@govtech-bb/$pkg"
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version already published — skipping"
              continue
            fi
            pnpm --filter "$name" pack --pack-destination /tmp/pkgs
            npm publish "/tmp/pkgs/govtech-bb-$pkg-$version.tgz" --provenance --access public --tag alpha
          done
