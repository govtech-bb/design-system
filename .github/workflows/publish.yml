name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter=@govtech-bb/react --filter=@govtech-bb/styles

      # Recursive publish across the three public packages via OIDC trusted
      # publishing — no NPM_TOKEN; auth comes from the id-token write permission
      # above. pnpm skips versions already on the registry and fails loudly on
      # real errors. Explicit --filter list so a future package can't auto-publish.
      - name: Publish packages
        run: pnpm -r --filter=@govtech-bb/design --filter=@govtech-bb/react --filter=@govtech-bb/styles publish --provenance --access public --no-git-checks --tag alpha
