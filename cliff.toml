# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Versions\n
"""
body = """
{% if version -%}
    ## {{ version | trim_start_matches(pat="v") }}
{% else -%}
    ## Unreleased
{% endif -%}
{% if timestamp -%}
_{{ timestamp | date(format="%b %d, %Y") }}_
{% endif -%}
{% set has_general = false -%}
{% for group, commits in commits | group_by(attribute="scope") -%}
    {% if not group -%}
        {% set_global has_general = true -%}
    {% endif -%}
{% endfor -%}
{% if has_general %}
### General changes
{% for group, commits in commits | group_by(attribute="scope") -%}
    {% if not group -%}
        {% for commit in commits -%}
        - {% if commit.breaking %}**Breaking change:** {% endif %}{{ commit.message | upper_first }}{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/govtech-bb/design-system/pull/{{ commit.remote.pr_number }})){% endif %} by @{{ commit.author.name | replace(from=" ", to="") }}
        {% endfor -%}
    {% endif -%}
{% endfor -%}
{% endif -%}
{% for group, commits in commits | group_by(attribute="scope") -%}
    {% if group and group != "Dependencies" %}
### {{ group }}
        {% for commit in commits -%}
        - {% if commit.breaking %}**Breaking change:** {% endif %}{{ commit.message | upper_first }}{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/govtech-bb/design-system/pull/{{ commit.remote.pr_number }})){% endif %} by @{{ commit.author.name | replace(from=" ", to="") }}
        {% endfor -%}
    {% endif -%}
{% endfor -%}
{% for group, commits in commits | group_by(attribute="scope") -%}
    {% if group == "Dependencies" %}
**Dependency Updates:** \
        {% for commit in commits %}\
[{{ loop.index }}\
{% if not loop.last %}, {% endif %}\
](https://github.com/govtech-bb/design-system/commit/{{ commit.id }})\
{% if not loop.last %} {% endif %}\
        {% endfor %}
    {% endif -%}
{% endfor -%}
"""
# template for the changelog footer
footer = """
{% if releases | length == 1 %}
	### See the [full changelog](https://github.com/govtech-bb/design-system/blob/main/CHANGELOG.md)
{% endif %}
<!-- generated by git-cliff -->
"""
# remove the leading and trailing whitespace from the templates
trim = true
# postprocessors
postprocessors = [
  # { pattern = '<REPO>', replace = "https://github.com/orhun/git-cliff" }, # replace repository URL
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
  { pattern = '^chore\\(deps.*\\):', replace = 'chore(Dependencies):' },
  # Replace issue numbers
  #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]
# regex for parsing and grouping commits
commit_parsers = [
  { message = "^init$", skip = true },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(release\\): bump", skip = true },
  { message = "^chore: Release", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore\\(bump\\)", skip = true },
  # Don't skip other commits - they all get included
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "govtech-bb"
repo = "design-system"
